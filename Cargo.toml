[package]
name = "cryptocurrencies_stuff"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = { version = "3.0.0", features = ["rand"] }
bip32 = "0.6.0"
secp256k1 = { version = "0.33.1", features = ["rand"] }
sha2 = "0.11"
ripemd = "0.2"
bech32 = "0.12.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json"] }
anyhow = "1.0.104"
